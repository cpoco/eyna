name: release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025-vs2026
            arch: x64
          - os: macos-26
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22"
      - run: |
          node .github/scripts/set-versions.mts
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cache-electron-${{ runner.os }}-${{ matrix.arch }}-${{ env.ELECTRON_VERSION }}
          path: |
            cache/electron-${{ env.ELECTRON_VERSION }}
            !cache/electron-${{ env.ELECTRON_VERSION }}/bin
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cache-node-${{ runner.os }}-${{ matrix.arch }}-${{ env.NODE_VERSION }}
          path: |
            cache/node-${{ env.NODE_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cache-vcpkg-${{ runner.os }}-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            cache-vcpkg-${{ runner.os }}-${{ matrix.arch }}-
          path: |
            cache/vcpkg
      - run: |
          vcpkg version
          git -C "${VCPKG_INSTALLATION_ROOT}" rev-parse HEAD
      - run: |
          npm ci
      - run: |
          npm run setup-native
      - run: |
          npm run setup-electron
      - run: |
          npm run c
      - run: |
          npm run b
      - run: |
          npm run p
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          draft: true
          prerelease: true
          files: dist/*.tar.gz
