name: test

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025-vs2026
            arch: x64
          - os: macos-26
            arch: arm64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.21"
      - uses: actions/cache@v6.1.0
        with:
          key: cache-${{ runner.os }}-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            cache-${{ runner.os }}-${{ matrix.arch }}-
          path: |
            cache
      - run: |
          vcpkg version
          git -C "${VCPKG_INSTALLATION_ROOT}" rev-parse HEAD
      - run: |
          npm ci
      - run: |
          npm run setup-native
      - run: |
          npm run setup-electron
      - run: |
          node pkg/native/scripts/cmake_node.mts
      - run: |
          node --import tsx pkg/fixture/index.mts
          node --import tsx pkg/native/test/test_compare.mts
          node --import tsx pkg/native/test/test_get.mts
          node --import tsx pkg/native/test/test_get_depth.mts
          node --import tsx pkg/native/test/test_get_regexp.mts
          node --import tsx pkg/native/test/test_icon.mts
          node --import tsx pkg/native/test/test_link.mts
          node --import tsx pkg/native/test/test_operation.mts
          node --import tsx pkg/native/test/test_time.mts
          node --import tsx pkg/native/test/test_os.mts
          node --import tsx pkg/native/test/test_arc.mts
          node --import tsx pkg/native/test/test_arc_tar.mts
          node --import tsx pkg/native/test/test_arc_tgz.mts
          node --import tsx pkg/native/test/test_arc_tzst.mts
          node --import tsx pkg/native/test/test_arc_zip.mts
          node --import tsx pkg/native/test/test_arc_rar.mts
          node --import tsx pkg/native/test/test_arc_rar_pw1.mts
          node --import tsx pkg/native/test/test_arc_rar_pw2.mts
          node --import tsx pkg/native/test/test_watch.mts
      - run: |
          npm run b
      - run: |
          npm run p
